<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Browse laptop files and screen on the phone</title>
  <desc id="desc">Start the portable Windows helper, paste its local link into the phone's laptop library, then browse files or open the laptop screen.</desc>
  <rect width="1400" height="650" rx="32" fill="#f3f7f7"/>
  <text x="60" y="72" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="#14262f">4 · Browse laptop files from your phone</text>
  <rect x="75" y="140" width="390" height="420" rx="26" fill="#fff" stroke="#dce7e7" stroke-width="3"/>
  <text x="110" y="192" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#0e8469">ON YOUR LAPTOP</text>
  <rect x="110" y="220" width="320" height="188" rx="14" fill="#14262f"/>
  <text x="140" y="268" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#fff">Start-Control.bat</text>
  <text x="140" y="308" font-family="Segoe UI,Arial" font-size="14" fill="#d7e6e2">Keep helper running</text>
  <rect x="135" y="338" width="270" height="45" rx="9" fill="#20373b"/>
  <text x="151" y="366" font-family="Consolas,monospace" font-size="13" fill="#b7efdb">http://192.168…:7070/?t=…</text>
  <text x="112" y="464" font-family="Segoe UI,Arial" font-size="16" fill="#546871">Both devices stay on the same hotspot.</text>
  <text x="112" y="492" font-family="Segoe UI,Arial" font-size="15" fill="#6b7c85">The helper shares Downloads by default.</text>
  <path d="M490 350h150m-24-24 24 24-24 24" fill="none" stroke="#0e8469" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="680" y="140" width="640" height="420" rx="30" fill="#fff" stroke="#dce7e7" stroke-width="3"/>
  <text x="720" y="192" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#0e8469">ON YOUR PHONE · LIBRARY</text>
  <rect x="720" y="220" width="268" height="52" rx="12" fill="#eff8f5" stroke="#b9ded2" stroke-width="2"/>
  <text x="744" y="253" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#14262f">Files on this phone</text>
  <rect x="1004" y="220" width="276" height="52" rx="12" fill="#0e8469"/>
  <text x="1035" y="253" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#fff">Files on the laptop</text>
  <rect x="720" y="296" width="560" height="52" rx="10" fill="#fff" stroke="#dce7e7" stroke-width="2"/>
  <text x="740" y="329" font-family="Segoe UI,Arial" font-size="15" fill="#6b7c85">Paste helper link here · saved for Screen too</text>
  <rect x="720" y="365" width="560" height="54" rx="12" fill="#14262f"/>
  <text x="888" y="400" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#fff">Load laptop files</text>
  <rect x="720" y="436" width="175" height="54" rx="12" fill="#eff8f5"/>
  <text x="764" y="470" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#14262f">Photos</text>
  <rect x="907" y="436" width="175" height="54" rx="12" fill="#eff8f5"/>
  <text x="958" y="470" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#14262f">Videos</text>
  <rect x="1094" y="436" width="186" height="54" rx="12" fill="#eff8f5"/>
  <text x="1145" y="470" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#14262f">Audio</text>
  <text x="720" y="530" font-family="Segoe UI,Arial" font-size="15" fill="#546871">Tap supported media to stream it in a compatible phone app.</text>
</svg>
