<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Browse and play PocketBridge files</title>
  <desc id="desc">A laptop browser gallery with visible image and video previews, download buttons, and a video player showing clear ten second skip controls.</desc>
  <rect width="1400" height="650" rx="32" fill="#f3f7f7"/>
  <text x="60" y="72" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="#14262f">2 · Browse previews, play videos, or download</text>
  <rect x="60" y="110" width="1280" height="490" rx="24" fill="#fff" stroke="#dce7e7" stroke-width="3"/>
  <rect x="60" y="110" width="1280" height="56" rx="24" fill="#14262f"/>
  <text x="90" y="147" font-family="Segoe UI,Arial" font-size="19" font-weight="700" fill="#fff">PocketBridge · Your library</text>
  <rect x="90" y="190" width="196" height="350" rx="15" fill="#f4f7f7"/>
  <text x="112" y="230" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#14262f">Photos</text>
  <text x="112" y="270" font-family="Segoe UI,Arial" font-size="18" fill="#66777f">Videos</text>
  <text x="112" y="310" font-family="Segoe UI,Arial" font-size="18" fill="#66777f">Audio</text>
  <text x="112" y="350" font-family="Segoe UI,Arial" font-size="18" fill="#66777f">Files</text>
  <rect x="320" y="190" width="240" height="180" rx="12" fill="#dceee8"/>
  <circle cx="460" cy="260" r="46" fill="#9bc7b9"/><path d="M350 347l72-72 47 44 38-34 45 62z" fill="#4d8c78"/>
  <text x="320" y="398" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#14262f">Preview visible here</text>
  <rect x="320" y="418" width="110" height="42" rx="9" fill="#e8f3f0"/><text x="344" y="446" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#0a6a55">View</text>
  <rect x="440" y="418" width="120" height="42" rx="9" fill="#fff" stroke="#dce7e7"/><text x="462" y="446" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#14262f">Download</text>
  <rect x="585" y="190" width="240" height="180" rx="12" fill="#243943"/>
  <rect x="640" y="222" width="130" height="105" rx="12" fill="#54746e"/><circle cx="705" cy="275" r="29" fill="#ffffff" opacity=".9"/><path d="M698 258v34l26-17z" fill="#0e8469"/>
  <text x="585" y="398" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#14262f">Video thumbnail</text>
  <rect x="585" y="418" width="110" height="42" rx="9" fill="#e8f3f0"/><text x="609" y="446" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#0a6a55">Play</text>
  <rect x="705" y="418" width="120" height="42" rx="9" fill="#fff" stroke="#dce7e7"/><text x="727" y="446" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#14262f">Download</text>
  <rect x="850" y="190" width="450" height="350" rx="14" fill="#101c23"/>
  <text x="880" y="228" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#eaf3f1">Video player · original quality</text>
  <rect x="880" y="250" width="390" height="210" rx="8" fill="#05090c"/>
  <circle cx="1075" cy="355" r="32" fill="#ffffff" opacity=".9"/><path d="M1068 337v36l29-18z" fill="#0e8469"/>
  <rect x="880" y="480" width="105" height="42" rx="9" fill="#1d3038"/><text x="895" y="507" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#fff">↶ Back 10s</text>
  <rect x="996" y="480" width="86" height="42" rx="9" fill="#0e8469"/><text x="1017" y="507" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#fff">Play</text>
  <rect x="1093" y="480" width="142" height="42" rx="9" fill="#1d3038"/><text x="1104" y="507" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#fff">Forward 10s ↷</text>
  <text x="850" y="574" font-family="Segoe UI,Arial" font-size="15" fill="#6b7c85">Click Play. Use the 10-second buttons or the seek bar.</text>
</svg>
