<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Share your Android phone screen to a laptop</title>
  <desc id="desc">Start sharing files on the phone, tap Share phone screen, approve the Android screen capture prompt, then choose Watch screen on the laptop.</desc>
  <rect width="1400" height="650" rx="32" fill="#f3f7f7"/>
  <text x="60" y="72" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="#14262f">3 · Share the phone screen</text>
  <rect x="95" y="140" width="460" height="420" rx="32" fill="#fff" stroke="#dce7e7" stroke-width="3"/>
  <rect x="230" y="160" width="190" height="18" rx="9" fill="#14262f"/>
  <text x="145" y="225" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#0e8469">ON YOUR PHONE</text>
  <rect x="145" y="255" width="360" height="68" rx="13" fill="#14262f"/>
  <text x="180" y="298" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#fff">Tap Share phone screen</text>
  <path d="M325 338v40m-16-16 16 16 16-16" fill="none" stroke="#0e8469" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="145" y="390" width="360" height="95" rx="13" fill="#eff8f5" stroke="#b9ded2" stroke-width="2"/>
  <text x="170" y="426" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#14262f">Allow Android screen capture</text>
  <text x="170" y="457" font-family="Segoe UI,Arial" font-size="15" fill="#546871">Android asks every time you start.</text>
  <path d="M605 350h150m-24-24 24 24-24 24" fill="none" stroke="#0e8469" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="825" y="140" width="475" height="420" rx="26" fill="#fff" stroke="#dce7e7" stroke-width="3"/>
  <text x="865" y="205" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#0e8469">ON YOUR LAPTOP</text>
  <rect x="865" y="240" width="395" height="250" rx="14" fill="#101c23"/>
  <rect x="885" y="260" width="355" height="210" rx="9" fill="#20373b"/>
  <rect x="1035" y="278" width="95" height="170" rx="18" fill="#eaf3f1"/><circle cx="1082" cy="306" r="8" fill="#0e8469"/>
  <text x="865" y="530" font-family="Segoe UI,Arial" font-size="18" fill="#14262f">Tap Watch screen and keep the phone awake.</text>
  <text x="865" y="552" font-family="Segoe UI,Arial" font-size="15" fill="#6b7c85">Both devices must stay on the same PocketBridge Wi-Fi.</text>
</svg>
