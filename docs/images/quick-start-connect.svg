<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Connect the laptop to PocketBridge</title>
  <desc id="desc">On the phone, tap Hotspot mode and note the shown network name and password. On the laptop, join that network, open the shown link, and enter the six digit code.</desc>
  <rect width="1400" height="650" rx="32" fill="#f3f7f7"/>
  <text x="60" y="72" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="#14262f">1 · Connect the laptop to the phone</text>
  <rect x="65" y="115" width="505" height="475" rx="28" fill="#fff" stroke="#dce7e7" stroke-width="3"/>
  <text x="105" y="165" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#0e8469">ON YOUR PHONE</text>
  <rect x="105" y="190" width="425" height="72" rx="14" fill="#eff8f5" stroke="#b9ded2" stroke-width="2"/>
  <text x="127" y="222" font-family="Segoe UI,Arial" font-size="21" font-weight="700" fill="#14262f">Choose Hotspot mode</text>
  <text x="127" y="246" font-family="Segoe UI,Arial" font-size="16" fill="#546871">Wi-Fi mode works when both devices share Wi-Fi.</text>
  <text x="105" y="310" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#6b7c85">JOIN THIS NETWORK ON YOUR LAPTOP</text>
  <text x="105" y="350" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#14262f">Network name</text>
  <rect x="105" y="365" width="425" height="48" rx="10" fill="#f5f8f8"/>
  <text x="124" y="396" font-family="Consolas,monospace" font-size="18" fill="#14262f">Use the name shown in PocketBridge</text>
  <text x="105" y="448" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#14262f">Password</text>
  <rect x="105" y="463" width="425" height="48" rx="10" fill="#f5f8f8"/>
  <text x="124" y="494" font-family="Consolas,monospace" font-size="18" fill="#14262f">Use the password shown in PocketBridge</text>
  <text x="105" y="552" font-family="Segoe UI,Arial" font-size="15" fill="#6b7c85">Keep the laptop connected if Windows says “No internet”.</text>
  <path d="M610 350h120m-24-24 24 24-24 24" fill="none" stroke="#0e8469" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="790" y="115" width="545" height="475" rx="28" fill="#fff" stroke="#dce7e7" stroke-width="3"/>
  <text x="835" y="165" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#0e8469">ON YOUR LAPTOP</text>
  <rect x="835" y="195" width="455" height="62" rx="13" fill="#14262f"/>
  <text x="860" y="234" font-family="Consolas,monospace" font-size="19" fill="#fff">Type the link shown on your phone</text>
  <text x="835" y="308" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#14262f">Enter the 6-digit code</text>
  <rect x="835" y="327" width="455" height="72" rx="14" fill="#f5f8f8" stroke="#dce7e7" stroke-width="2"/>
  <text x="875" y="375" font-family="Consolas,monospace" font-size="34" letter-spacing="12" fill="#14262f">123456</text>
  <rect x="835" y="430" width="455" height="60" rx="13" fill="#0e8469"/>
  <text x="940" y="469" font-family="Segoe UI,Arial" font-size="21" font-weight="700" fill="#fff">Open my files</text>
  <text x="835" y="535" font-family="Segoe UI,Arial" font-size="15" fill="#6b7c85">The code in this drawing is only an example.</text>
</svg>
