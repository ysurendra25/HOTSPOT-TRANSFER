name: Release PocketBridge

on:
  push:
    tags: [ 'v0.5.9.4' ]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null
      - name: Check browser routes and run Android tests
        run: |
          python3 tools/check-web-page.py
          bash gradlew testDebugUnitTest lintDebug --console=plain
      - name: Build arm64 and universal APKs
        run: |
          bash gradlew assembleDebug --console=plain
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/PocketBridge-${GITHUB_REF_NAME#v}.apk
          bash gradlew assembleDebug -PpocketbridgeUniversal=true --console=plain
          zip -j release-assets/PocketBridge-${GITHUB_REF_NAME#v}-universal.apk.zip app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: release-assets/*
          if-no-files-found: error

  windows-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: tools/win-control/upstream-v0.1.0/web-remote-desktop-0.1.0/go.sum
      - name: Test and build portable helper
        shell: pwsh
        run: ./tools/win-control/build.ps1
      - name: Package portable helper
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $stage = Join-Path $env:RUNNER_TEMP 'PocketBridge-Windows-Control'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item tools/win-control/dist/pc-remote.exe, tools/win-control/Start-Control.bat, tools/win-control/README.md $stage
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "PocketBridge-Windows-Control-$version.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-helper
          path: PocketBridge-Windows-Control-*.zip
          if-no-files-found: error

  publish:
    needs: [ android, windows-helper ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: cd release-assets && sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: PocketBridge ${{ github.ref_name }}
          body_path: RELEASE_NOTES_v0.5.9.4.md
          files: release-assets/*
