name: Release PocketBridge

# Runs for any version tag (v0.6.0.3, v0.6.0.4, …) and can be started by hand
# for an existing tag. The release notes file is chosen from the tag, so a new
# version only needs its RELEASE_NOTES_<tag>.md committed before tagging.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build and publish, for example v0.6.0.3'
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Check the tag, version and release notes agree
        run: |
          version="${RELEASE_TAG#v}"
          notes="RELEASE_NOTES_${RELEASE_TAG}.md"
          test -f "$notes" || { echo "::error::$notes is missing"; exit 1; }
          grep -q "versionName = \"$version\"" app/build.gradle.kts || { echo "::error::app/build.gradle.kts versionName is not $version"; exit 1; }
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null
      - name: Check browser routes and run Android tests
        run: |
          python3 tools/check-web-page.py
          bash gradlew testDebugUnitTest lintDebug --console=plain
      - name: Build universal APK
        run: |
          mkdir -p release-assets
          bash gradlew assembleDebug -PpocketbridgeUniversal=true --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/PocketBridge-${RELEASE_TAG#v}-universal.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: release-assets/*
          if-no-files-found: error

  windows-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: tools/win-control/upstream-v0.1.0/web-remote-desktop-0.1.0/go.sum
      - name: Vet the helper
        shell: pwsh
        working-directory: tools/win-control/upstream-v0.1.0/web-remote-desktop-0.1.0
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'go vet failed.' }
      - name: Test and build portable helper
        shell: pwsh
        run: ./tools/win-control/build.ps1
      - name: Package portable helper
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $stage = Join-Path $env:RUNNER_TEMP 'PocketBridge-Windows-Control'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item tools/win-control/Start-Control.bat, tools/win-control/README.md $stage
          # Ship one name only: the launcher and the docs both refer to this one.
          Copy-Item tools/win-control/dist/pc-remote.exe (Join-Path $stage 'PocketBridge-Windows-Control.exe')
          Copy-Item tools/win-control/upstream-v0.1.0/web-remote-desktop-0.1.0/LICENSE $stage/UPSTREAM-LICENSE.txt
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "PocketBridge-Windows-Control-$version.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-helper
          path: PocketBridge-Windows-Control-*.zip
          if-no-files-found: error

  publish:
    needs: [ android, windows-helper ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: cd release-assets && sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: PocketBridge ${{ env.RELEASE_TAG }}
          body_path: RELEASE_NOTES_${{ env.RELEASE_TAG }}.md
          files: release-assets/*
