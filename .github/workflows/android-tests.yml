name: Android tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Check the browser page against the server
        run: python3 tools/check-web-page.py

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build the debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest
