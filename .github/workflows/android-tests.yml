name: Android tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: tools/win-control/upstream-v0.1.0/web-remote-desktop-0.1.0/go.sum

      - name: Check the browser page against the server
        run: |
          python3 tools/check-web-page.py
          node tools/test-player-layout.js
          node tools/test-phone-screen.js

      - name: Run unit tests
        run: bash gradlew testDebugUnitTest --console=plain

      - name: Build the debug APK
        run: bash gradlew assembleDebug --console=plain

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest
