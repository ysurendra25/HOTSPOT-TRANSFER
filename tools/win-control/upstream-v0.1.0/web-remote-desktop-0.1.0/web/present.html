<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>PocketBridge · Share laptop screen</title>
<style>
:root{color-scheme:dark}body{margin:0;background:#091519;color:#e7f4f2;font:16px/1.5 system-ui}main{max-width:720px;margin:7vh auto;padding:20px}
h1{font-size:clamp(26px,5vw,40px);margin:0}p{color:#bed4d7}button{background:#25b692;color:#041f1b;border:0;border-radius:10px;font:700 16px system-ui;padding:13px 20px;cursor:pointer;margin:0 8px 8px 0}button:disabled{opacity:.45}
video{margin-top:12px;background:#000;max-height:50vh;width:100%;object-fit:contain;border-radius:8px}
</style>
</head>
<body><main>
<h1>Share laptop screen</h1>
<p id="destination"></p>
<section id="pair" hidden><label>Phone hotspot link <input id="phone" type="url"></label>
<label>Phone code <input id="code" inputmode="numeric" maxlength="6" autocomplete="off"></label></section>
<button id="start" disabled>Choose screen or window</button><button id="stop" disabled>Stop sharing</button>
<p id="status" role="status">Connecting to the PocketBridge tab…</p>
<video playsinline muted autoplay hidden></video>
</main>
<script src="/capture-signal.js"></script>
<script>
(() => {
  const start = document.querySelector('#start'), stop = document.querySelector('#stop');
  const status = document.querySelector('#status'), preview = document.querySelector('video');
  const args = new URLSearchParams(location.hash.slice(1));
  const standalone = location.pathname === '/offline-screen';
  const nonce = args.get('nonce'), destination = args.get('phone');
  let phone;
  try { phone = new URL(destination); } catch {}
  const localHost = host => /^(10\.|127\.|172\.(1[6-9]|2\d|3[01])\.|192\.(168|0)\.|169\.254\.)/.test(host)
      && /^\d{1,3}(\.\d{1,3}){3}$/.test(host);
  if (window.top !== self || (!standalone && (!phone || phone.protocol !== 'http:' || !localHost(phone.hostname) || phone.port !== '43117' || phone.origin !== destination ||
      !/^[0-9a-f]{32}$/.test(nonce) || !window.opener))) {
    status.textContent = 'Open Screen in the paired PocketBridge tab, then choose Share laptop screen.';
    return;
  }
  const form = document.querySelector('#pair');
  const phoneField = document.querySelector('#phone'), codeField = document.querySelector('#code');
  form.hidden = !standalone;
  phoneField.value = phone?.origin || '';
  document.querySelector('#destination').textContent = standalone ? 'Enter the hotspot link and the current code from PocketBridge on the phone.' : 'Your selection will be visible on the phone at ' + phone.host + '.';
  let pairing, localPublisher = '';
  let channel, rpcId = 0, generation = 0, stream, peer, published = false;
  const pending = new Map();
  const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
  async function rpc(action, values = {}) {
    if (standalone) {
      const response = await localSignal({...pairing, feature:'screen', data:{action, ...values, publisher:localPublisher}});
      if (action === 'start') localPublisher = response.publisher;
      return response;
    }
    if (!channel || window.opener.closed) return Promise.reject(new Error('The paired PocketBridge tab closed.'));
    const id = ++rpcId;
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        pending.delete(id); reject(new Error('The paired tab did not answer. Check the phone connection and try again.'));
      }, 9000);
      pending.set(id, reply => { clearTimeout(timer); reply.error ? reject(new Error(reply.error)) : resolve(reply.result); });
      channel.postMessage({id, action, ...values});
    });
  }
  function closePeer() {
    if (peer) { peer.onconnectionstatechange = null; peer.close(); peer = null; }
  }
  async function finish(message) {
    ++generation;
    closePeer();
    if (stream) {
      stream.getTracks().forEach(track => { track.onended = null; track.stop(); });
      stream = null;
    }
    preview.srcObject = null;
    preview.hidden = true;
    stop.disabled = true;
    if (published) {
      published = false;
      try { await rpc('stop'); } catch {}
    }
    start.disabled = !standalone && !channel;
    status.textContent = message;
  }
  // 0.7.0.1 latency fixes for laptop → phone. Edge used to send the screen as
  // VP8 at Chrome's default screenshare limits (about 2.5 Mbps and
  // maintain-resolution), so a 1080p+ desktop dropped to a few frames per
  // second and the phone decoded VP8 in software. Prefer H.264 (hardware
  // encode on Windows, hardware decode on every Android phone), raise the
  // bitrate ceiling for the hotspot, and let both frame rate and resolution
  // adapt under congestion instead of building a backlog.
  function preferHardwareCodec(transceiver) {
    try {
      if (!transceiver || !transceiver.setCodecPreferences || !RTCRtpSender.getCapabilities) return;
      const codecs = RTCRtpSender.getCapabilities('video').codecs;
      const rank = c => {
        const mime = c.mimeType.toLowerCase(), f = (c.sdpFmtpLine || '').toLowerCase();
        if (mime === 'video/h264') return f.includes('packetization-mode=1') && /profile-level-id=42e0/.test(f) ? 0 : f.includes('packetization-mode=1') ? 1 : 2;
        if (mime === 'video/vp8') return 3;
        if (mime === 'video/vp9') return 4;
        if (mime === 'video/av1') return 5;
        return 6; // rtx, red, ulpfec keep their place after the media codecs
      };
      transceiver.setCodecPreferences(codecs.slice().sort((a, b) => rank(a) - rank(b)));
    } catch {}
  }
  async function tuneSender(sender) {
    try {
      const p = sender.getParameters();
      if (!p.encodings || !p.encodings.length) p.encodings = [{}];
      p.encodings[0].maxBitrate = 12000000;
      p.encodings[0].maxFramerate = 30;
      p.encodings[0].scaleResolutionDownBy = 1;
      p.degradationPreference = 'balanced';
      await sender.setParameters(p);
    } catch {}
  }
  function tuneVideoSdp(sdp, maxKbps) {
    const params = 'x-google-start-bitrate=2500;x-google-min-bitrate=300;x-google-max-bitrate=' + maxKbps;
    const out = [];
    let video = false;
    for (const line of sdp.split(/\r?\n/)) {
      if (line.startsWith('m=')) video = line.startsWith('m=video');
      if (video && (line.startsWith('b=AS:') || line.startsWith('b=TIAS:'))) continue;
      const tune = video && line.startsWith('a=fmtp:') && !line.includes("x-google-max-bitrate") && !/apt=/.test(line) && !/^a=fmtp:\d+ \d+\//.test(line);
      out.push(tune ? line + ';' + params : line);
    }
    return out.join('\r\n');
  }
  async function sendToViewer(gen, offer, viewer) {
    closePeer();
    const pc = new RTCPeerConnection({iceServers:[]});
    peer = pc;
    pc.onconnectionstatechange = () => {
      if (peer !== pc) return;
      if (pc.connectionState === 'connected') status.textContent = 'Your phone is receiving this screen.';
      if (pc.connectionState === 'failed') status.textContent = 'Reconnecting to the phone…';
    };
    await pc.setRemoteDescription({type:'offer',sdp:tuneVideoSdp(offer, 12000)});
    const track = stream.getVideoTracks()[0];
    // Text on a laptop screen must stay sharp, but motion must not stall.
    try { if ('contentHint' in track) track.contentHint = 'detail'; } catch {}
    const sender = pc.addTrack(track, stream);
    preferHardwareCodec(pc.getTransceivers().find(t => t.sender === sender));
    await pc.setLocalDescription(await pc.createAnswer());
    await tuneSender(sender);
    for (let i = 0; gen === generation && pc.iceGatheringState !== 'complete' && i < 45; i++) await delay(100);
    if (gen !== generation) return;
    if (!/^a=candidate:/m.test(pc.localDescription.sdp)) throw new Error('Edge found no local network route to the phone.');
    await rpc('answer', {viewer, sdp:pc.localDescription.sdp});
  }
  async function present() {
    if (standalone) {
      pairing = {phone:phoneField.value.trim(), code:codeField.value.trim()};
      if (!/^\d{6}$/.test(pairing.code) || !pairing.phone) { status.textContent='Enter the phone link and six-digit code first.'; return; }
    }
    const gen = ++generation;
    start.disabled = true;
    try {
      // Invoke directly from the click so Edge can show its display picker.
      const selected = await navigator.mediaDevices.getDisplayMedia({video:{frameRate:{ideal:30,max:30}},audio:false});
      if (gen !== generation) { selected.getTracks().forEach(t => t.stop()); return; }
      stream = selected;
      stream.getVideoTracks()[0].onended = () => finish('Screen sharing stopped.');
      preview.srcObject = stream;
      preview.hidden = false;
      await rpc('start');
      if (gen !== generation) { await rpc('stop'); return; }
      published = true;
      stop.disabled = false;
      status.textContent = 'On the phone, open Screen and tap Watch Edge screen.';
      let previous = '', failures = 0;
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      let previewNeeded = false;
      while (gen === generation) {
        try {
          const result = await rpc('poll', {previous});
          if (gen !== generation) return;
          previewNeeded = result.needsFrame && standalone;
          if (previewNeeded && preview.videoWidth && preview.readyState >= 2) {
            const scale = Math.min(1, 960 / Math.max(preview.videoWidth, preview.videoHeight));
            canvas.width = Math.max(1,Math.round(preview.videoWidth * scale));
            canvas.height = Math.max(1,Math.round(preview.videoHeight * scale));
            ctx.drawImage(preview,0,0,canvas.width,canvas.height);
            const jpeg = canvas.toDataURL('image/jpeg',0.64);
            if (jpeg.length <= 192000) await rpc('frame',{jpeg});
          }
          if (!result.viewer) {
            closePeer();
            previous = '';
            status.textContent = 'On the phone, open Screen and tap Watch Edge screen.';
          } else if (result.offer) {
            await sendToViewer(gen, result.offer, result.viewer);
            previous = result.viewer;
          }
          failures = 0;
        } catch (error) {
          if (gen !== generation) return;
          if (++failures >= 3 || (!standalone && window.opener.closed)) throw error;
          status.textContent = 'The phone connection was interrupted. Retrying…';
        }
        await delay(previewNeeded ? 140 : peer?.connectionState === 'connected' ? 1700 : 550);
      }
    } catch (error) {
      if (gen === generation) await finish(error.name === 'NotAllowedError' ? 'No screen was shared. Choose a screen when ready.' : error.message);
    }
  }
  window.addEventListener('message', event => {
    if (event.source !== window.opener || event.origin !== phone.origin || event.data?.type !== 'pb-present-port'
        || event.data.nonce !== nonce || !event.ports[0] || channel) return;
    channel = event.ports[0];
    channel.onmessage = e => {
      const accept = pending.get(e.data?.id);
      if (accept) { pending.delete(e.data.id); accept(e.data); }
    };
    start.disabled = !navigator.mediaDevices?.getDisplayMedia;
    status.textContent = start.disabled ? 'Open the presenter in current Microsoft Edge on this laptop.' : 'Choose what to share in Edge.';
  });
  start.addEventListener('click', present);
  stop.addEventListener('click', () => finish('Screen sharing stopped.'));
  window.addEventListener('pagehide', () => finish('Presenter closed.'));
  if (standalone) {
    start.disabled = !navigator.mediaDevices?.getDisplayMedia;
    status.textContent = 'Choose a display, then tap Screen → Watch Edge screen on the phone.';
  } else window.opener.postMessage({type:'pb-present-ready', nonce}, phone.origin);
})();
</script>
</body></html>
